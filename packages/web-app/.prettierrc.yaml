endOfLine: "auto"
plugins:
  - prettier-plugin-jsdoc
  - prettier-plugin-packagejson
  # Project-specific: sorts Tailwind classes in the rebuilt UI, using its stylesheet for the custom tokens.
  - prettier-plugin-tailwindcss
printWidth: 120
proseWrap: "always"
semi: false
singleQuote: true
trailingComma: "all"
overrides:
  - files:
      - "*.yaml"
      - "*.yml"
    options:
      singleQuote: false
tailwindStylesheet: ./src/ui/tailwind.css
tailwindFunctions:
  - cn
  - cva
